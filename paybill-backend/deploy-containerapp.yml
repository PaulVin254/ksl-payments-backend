name: Build and Deploy Paybill Backend to Azure Container Apps

on:
  push:
    branches:
      - main
    paths:
      - 'paybill-backend/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container image
        uses: docker/build-push-action@v5
        with:
          context: ./paybill-backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/business-paybill-backend:latest
            ghcr.io/${{ github.repository_owner }}/business-paybill-backend:${{ github.sha }}
